<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveRoom Playground</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="bg-mesh"></div>
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="/" class="brand"><span class="brand-dot"></span>LiveRoom</a>
      <div class="status-pill offline" id="status-pill">
        <span class="status-dot"></span><span id="status-text">Connecting...</span>
      </div>
    </div>
  </nav>

  <main class="container" style="padding: 30px 24px 100px;">
    <div style="background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:20px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
      <div>
        <div style="font-size:0.75rem;text-transform:uppercase;color:var(--text-dim);font-weight:700;">Room ID</div>
        <div style="font-family:var(--font-mono);font-size:1.25rem;font-weight:700;" id="room-id-display">Loading...</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <div style="text-align:right;">
          <div style="font-size:0.75rem;color:var(--text-dim);" id="user-count">0 Online</div>
          <div style="font-size:0.75rem;color:var(--accent-cyan);" id="typing-status"></div>
        </div>
        <div class="avatar-stack" id="presence-list"></div>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-secondary" id="btn-copy-link">🔗 Copy Link</button>
        <button class="btn btn-secondary" id="btn-new-room">➕ New Room</button>
        <button class="btn btn-chaos" id="btn-chaos-test">⚡ Chaos: Drop 4s</button>
      </div>
    </div>

    <div style="display:grid;grid-template-columns: 2fr 1fr;gap:24px;">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h3 style="color:#fff;">Shared State</h3>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary" id="btn-undo">↶ Undo</button>
            <button class="btn btn-secondary" id="btn-redo">↷ Redo</button>
          </div>
        </div>

        <div style="background:rgba(255,255,255,0.03);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:18px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;">
          <div><strong>Shared Counter</strong></div>
          <div style="display:flex;align-items:center;gap:12px;">
            <button class="btn btn-secondary" id="btn-dec">−</button>
            <span id="counter-val" style="font-size:2rem;font-family:var(--font-mono);font-weight:700;color:var(--accent-cyan);min-width:50px;text-align:center;">0</span>
            <button class="btn btn-primary" id="btn-inc">+</button>
          </div>
        </div>

        <textarea id="shared-text" rows="6" placeholder="Type here in multiple tabs to test live sync..." style="width:100%;background:rgba(0,0,0,0.3);border:1px solid var(--border-subtle);color:#fff;padding:12px;border-radius:var(--radius-sm);outline:none;"></textarea>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-subtle);">
          <span style="font-size:0.85rem;color:var(--text-muted);">Reactions:</span>
          <div class="reactions-bar">
            <button class="react-btn" data-emoji="❤️">❤️</button>
            <button class="react-btn" data-emoji="🔥">🔥</button>
            <button class="react-btn" data-emoji="🚀">🚀</button>
            <button class="react-btn" data-emoji="🎉">🎉</button>
          </div>
        </div>
      </div>

      <div class="card" style="text-align:center;">
        <h4 style="margin-bottom:12px;color:#fff;">Scan on Mobile</h4>
        <div style="background:#0f172a;padding:12px;display:inline-block;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);">
          <img id="qr-code-img" src="" width="160" height="160" alt="QR Code">
        </div>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toast-container"></div>
 
</body>
</html>
